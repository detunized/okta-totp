<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okta Verify Device Register</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: light-dark(#111, #e8e8e8);
    --muted: light-dark(#666, #9a9a9a);
    --bg: light-dark(#fff, #111);
    --surface: light-dark(#fff, #1c1c1c);
    --border: light-dark(#bbb, #3a3a3a);
    --border-strong: light-dark(#888, #555);
    --btn-bg: light-dark(#f2f2f2, #2a2a2a);
    --btn-bg-hover: light-dark(#e6e6e6, #333);
    --accent: light-dark(#1b74e4, #4aa3ff);
    --ok-bg: light-dark(#eaf6ec, #133a1a);
    --ok-border: light-dark(#b4dcbc, #2a6a36);
    --ok-fg: light-dark(#155724, #9adfa8);
    --err-bg: light-dark(#fdecec, #3a1414);
    --err-border: light-dark(#f1bcbc, #7a2a2a);
    --err-fg: light-dark(#a31212, #ff8a8a);
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 680px; margin: 2em auto; padding: 0 1em; line-height: 1.4; }
  h1 { margin-bottom: 0.2em; }
  p.lead { color: var(--muted); margin-top: 0; }
  code { background: var(--btn-bg); padding: 0.05em 0.35em; border-radius: 3px; font-size: 0.9em; }
  label { display: block; margin: 1em 0 0.25em; font-weight: 600; }
  input[type=text], textarea {
    width: 100%; font: inherit; padding: 0.5em; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface); color: var(--fg);
  }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea { min-height: 4.5em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  button {
    font: inherit; padding: 0.6em 1.2em; margin-top: 1.2em;
    border: 1px solid var(--border-strong); border-radius: 4px;
    background: var(--btn-bg); color: var(--fg); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--btn-bg-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .drop {
    border: 2px dashed var(--border-strong); padding: 1.5em; text-align: center;
    border-radius: 8px; outline: none; cursor: text; color: var(--muted);
  }
  .drop:focus, .drop.over { border-color: var(--accent); color: var(--fg); }
  .drop.ok { border-color: var(--ok-fg); color: var(--ok-fg); }
  .drop.err { border-color: var(--err-fg); color: var(--err-fg); }
  .result { margin-top: 1.2em; padding: 1em; background: var(--ok-bg); border: 1px solid var(--ok-border); border-radius: 6px; }
  .error { margin-top: 1.2em; padding: 1em; background: var(--err-bg); border: 1px solid var(--err-border); border-radius: 6px; color: var(--err-fg); }
  .secret {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.15em;
    word-break: break-all; user-select: all; padding: 0.4em 0.6em;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    display: inline-block; margin-top: 0.4em;
  }
  pre { background: var(--btn-bg); padding: 0.75em; overflow-x: auto; font-size: 0.85em; border-radius: 4px; }
  .row { display: flex; gap: 0.5em; align-items: center; }
  .row button { margin-top: 0; }
</style>
</head>
<body>
<h1>Okta Verify Device Register</h1>
<p class="lead">Paste a QR code image (⌘V) or the <code>oktaverify://</code> URL, then register the device and grab the TOTP secret.</p>

<label for="drop">QR image or URL</label>
<div id="drop" class="drop" tabindex="0">Click here and paste (⌘V) a QR image, or paste the URL into the field below.</div>

<label for="url">oktaverify:// URL</label>
<textarea id="url" placeholder="oktaverify://..." spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>

<label for="device">Device name</label>
<input id="device" type="text" value="1Password">

<button id="submit">Register device</button>

<div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const drop = document.getElementById("drop");
  const urlInput = document.getElementById("url");
  const deviceInput = document.getElementById("device");
  const submitBtn = document.getElementById("submit");
  const resultDiv = document.getElementById("result");

  drop.addEventListener("click", () => drop.focus());

  document.addEventListener("paste", async (e) => {
    const items = e.clipboardData?.items || [];
    for (const item of items) {
      if (item.type.startsWith("image/")) {
        e.preventDefault();
        const blob = item.getAsFile();
        await handleImage(blob);
        return;
      }
    }
    const text = e.clipboardData?.getData("text") || "";
    if (text.trim().startsWith("oktaverify://")) {
      e.preventDefault();
      urlInput.value = text.trim();
      setDrop("URL pasted", "ok");
    }
  });

  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", async (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    const file = e.dataTransfer?.files?.[0];
    if (file && file.type.startsWith("image/")) await handleImage(file);
  });

  async function handleImage(blob) {
    setDrop("Decoding QR…", "");
    try {
      const url = await decodeQr(blob);
      if (url) {
        urlInput.value = url;
        setDrop("QR decoded ✓", "ok");
      } else {
        setDrop("Could not read a QR code from that image", "err");
      }
    } catch (err) {
      setDrop("Error decoding: " + err.message, "err");
    }
  }

  async function decodeQr(blob) {
    const img = await blobToImage(blob);
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    return code?.data || null;
  }

  function blobToImage(blob) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Invalid image"));
      img.src = URL.createObjectURL(blob);
    });
  }

  function setDrop(text, cls) {
    drop.textContent = text;
    drop.classList.remove("ok", "err");
    if (cls) drop.classList.add(cls);
  }

  submitBtn.addEventListener("click", async () => {
    resultDiv.innerHTML = "";
    const oktaUrl = urlInput.value.trim();
    const deviceName = deviceInput.value.trim() || "1Password";

    if (!oktaUrl.startsWith("oktaverify://")) {
      showError("URL must start with oktaverify://");
      return;
    }

    submitBtn.disabled = true;
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = "Registering…";

    try {
      const r = await fetch("/api/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ oktaUrl, deviceName })
      });
      const data = await r.json();
      if (!r.ok) {
        showError(data.error || r.statusText, data.response ?? data);
      } else if (!data.sharedSecret) {
        showError("Response did not contain a sharedSecret", data.raw);
      } else {
        showSecret(data.sharedSecret);
      }
    } catch (err) {
      showError(err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  });

  function showSecret(secret) {
    const wrap = document.createElement("div");
    wrap.className = "result";
    const label = document.createElement("div");
    label.innerHTML = "<strong>Shared secret (paste into 1Password)</strong>";
    const box = document.createElement("div");
    box.className = "secret";
    box.textContent = secret;
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "0.5em";
    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(secret);
      copy.textContent = "Copied ✓";
      setTimeout(() => (copy.textContent = "Copy"), 1500);
    });
    row.appendChild(copy);
    wrap.append(label, box, row);
    resultDiv.appendChild(wrap);
  }

  function showError(msg, detail) {
    const wrap = document.createElement("div");
    wrap.className = "error";
    const head = document.createElement("div");
    head.innerHTML = "<strong>Error:</strong> " + msg;
    wrap.appendChild(head);
    if (detail !== undefined) {
      const pre = document.createElement("pre");
      pre.textContent = typeof detail === "string" ? detail : JSON.stringify(detail, null, 2);
      wrap.appendChild(pre);
    }
    resultDiv.appendChild(wrap);
  }
</script>
</body>
</html>
