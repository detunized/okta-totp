<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okta Verify Device Register</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 680px; margin: 2em auto; padding: 0 1em; line-height: 1.4; }
  h1 { margin-bottom: 0.2em; }
  p.lead { color: #666; margin-top: 0; }
  label { display: block; margin: 1em 0 0.25em; font-weight: 600; }
  input[type=text], textarea { width: 100%; font: inherit; padding: 0.5em; box-sizing: border-box; border: 1px solid #999; border-radius: 4px; background: canvas; color: canvastext; }
  textarea { min-height: 4.5em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  button { font: inherit; padding: 0.6em 1.2em; margin-top: 1.2em; border: 1px solid #555; border-radius: 4px; background: #eee; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .drop { border: 2px dashed #888; padding: 1.5em; text-align: center; border-radius: 8px; outline: none; cursor: text; color: #666; }
  .drop:focus, .drop.over { border-color: #28f; color: inherit; }
  .drop.ok { border-color: #2a2; color: #2a2; }
  .drop.err { border-color: #c33; color: #c33; }
  .result { margin-top: 1.2em; padding: 1em; background: rgba(0,128,0,0.08); border: 1px solid rgba(0,128,0,0.3); border-radius: 6px; }
  .error { margin-top: 1.2em; padding: 1em; background: rgba(192,0,0,0.08); border: 1px solid rgba(192,0,0,0.3); border-radius: 6px; color: #c00; }
  .secret { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.15em; word-break: break-all; user-select: all; padding: 0.4em 0.6em; background: canvas; border: 1px solid #999; border-radius: 4px; display: inline-block; margin-top: 0.4em; }
  pre { background: rgba(128,128,128,0.1); padding: 0.75em; overflow-x: auto; font-size: 0.85em; border-radius: 4px; }
  .row { display: flex; gap: 0.5em; align-items: center; }
  .row button { margin-top: 0; }
</style>
</head>
<body>
<h1>Okta Verify Device Register</h1>
<p class="lead">Paste a QR code image (⌘V) or the <code>oktaverify://</code> URL, then register the device and grab the TOTP secret.</p>

<label for="drop">QR image or URL</label>
<div id="drop" class="drop" tabindex="0">Click here and paste (⌘V) a QR image, or paste the URL into the field below.</div>

<label for="url">oktaverify:// URL</label>
<textarea id="url" placeholder="oktaverify://..." spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>

<label for="device">Device name</label>
<input id="device" type="text" value="1Password">

<button id="submit">Register device</button>

<div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const drop = document.getElementById("drop");
  const urlInput = document.getElementById("url");
  const deviceInput = document.getElementById("device");
  const submitBtn = document.getElementById("submit");
  const resultDiv = document.getElementById("result");

  drop.addEventListener("click", () => drop.focus());

  document.addEventListener("paste", async (e) => {
    const items = e.clipboardData?.items || [];
    for (const item of items) {
      if (item.type.startsWith("image/")) {
        e.preventDefault();
        const blob = item.getAsFile();
        await handleImage(blob);
        return;
      }
    }
    const text = e.clipboardData?.getData("text") || "";
    if (text.trim().startsWith("oktaverify://")) {
      e.preventDefault();
      urlInput.value = text.trim();
      setDrop("URL pasted", "ok");
    }
  });

  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", async (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    const file = e.dataTransfer?.files?.[0];
    if (file && file.type.startsWith("image/")) await handleImage(file);
  });

  async function handleImage(blob) {
    setDrop("Decoding QR…", "");
    try {
      const url = await decodeQr(blob);
      if (url) {
        urlInput.value = url;
        setDrop("QR decoded ✓", "ok");
      } else {
        setDrop("Could not read a QR code from that image", "err");
      }
    } catch (err) {
      setDrop("Error decoding: " + err.message, "err");
    }
  }

  async function decodeQr(blob) {
    const img = await blobToImage(blob);
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    return code?.data || null;
  }

  function blobToImage(blob) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Invalid image"));
      img.src = URL.createObjectURL(blob);
    });
  }

  function setDrop(text, cls) {
    drop.textContent = text;
    drop.classList.remove("ok", "err");
    if (cls) drop.classList.add(cls);
  }

  submitBtn.addEventListener("click", async () => {
    resultDiv.innerHTML = "";
    const oktaUrl = urlInput.value.trim();
    const deviceName = deviceInput.value.trim() || "1Password";

    if (!oktaUrl.startsWith("oktaverify://")) {
      showError("URL must start with oktaverify://");
      return;
    }

    submitBtn.disabled = true;
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = "Registering…";

    try {
      const r = await fetch("/api/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ oktaUrl, deviceName })
      });
      const data = await r.json();
      if (!r.ok) {
        showError(data.error || r.statusText, data.response ?? data);
      } else if (!data.sharedSecret) {
        showError("Response did not contain a sharedSecret", data.raw);
      } else {
        showSecret(data.sharedSecret);
      }
    } catch (err) {
      showError(err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  });

  function showSecret(secret) {
    const wrap = document.createElement("div");
    wrap.className = "result";
    const label = document.createElement("div");
    label.innerHTML = "<strong>Shared secret (paste into 1Password)</strong>";
    const box = document.createElement("div");
    box.className = "secret";
    box.textContent = secret;
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "0.5em";
    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(secret);
      copy.textContent = "Copied ✓";
      setTimeout(() => (copy.textContent = "Copy"), 1500);
    });
    row.appendChild(copy);
    wrap.append(label, box, row);
    resultDiv.appendChild(wrap);
  }

  function showError(msg, detail) {
    const wrap = document.createElement("div");
    wrap.className = "error";
    const head = document.createElement("div");
    head.innerHTML = "<strong>Error:</strong> " + msg;
    wrap.appendChild(head);
    if (detail !== undefined) {
      const pre = document.createElement("pre");
      pre.textContent = typeof detail === "string" ? detail : JSON.stringify(detail, null, 2);
      wrap.appendChild(pre);
    }
    resultDiv.appendChild(wrap);
  }
</script>
</body>
</html>
